# Lint, typecheck, unit tests, and production build.
# React Doctor stays advisory in its own workflow; this gate must pass.

name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck Convex
        run: npm run typecheck:convex

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; real values are not required to compile routes.
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          CONVEX_DEPLOYMENT: anonymous:example
