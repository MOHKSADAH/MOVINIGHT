<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="MOVINIGHT  Track movies with your crew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="55%" stop-color="#141218"/>
      <stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c9a227" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" fill="url(#bg)"/>
  <polygon points="0,40 520,160 520,260 0,380" fill="url(#beam)"/>
  <rect width="1400" height="420" fill="url(#grain)"/>
  <!-- abstract posters -->
  <g opacity="0.55" transform="translate(980 70)">
    <rect x="0" y="20" width="110" height="160" rx="6" fill="#2a2a32" stroke="#3a3a44"/>
    <rect x="70" y="0" width="110" height="160" rx="6" fill="#32323c" stroke="#4a4a56"/>
    <rect x="140" y="30" width="110" height="160" rx="6" fill="#26262e" stroke="#3a3a44"/>
  </g>
  <!-- reel hint -->
  <g transform="translate(120 210)" fill="none" stroke="#c9a227" stroke-opacity="0.55" stroke-width="3">
    <circle r="46"/>
    <circle r="18"/>
    <circle cx="-28" cy="-16" r="8"/>
    <circle cx="28" cy="-16" r="8"/>
    <circle cx="-28" cy="16" r="8"/>
    <circle cx="28" cy="16" r="8"/>
  </g>
  <text x="700" y="195" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="6" fill="#f5f2ea">MOVINIGHT</text>
  <text x="700" y="250" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#b8b0a4">Track movies with your crew</text>
  <line x1="580" y1="280" x2="820" y2="280" stroke="#c9a227" stroke-width="2" stroke-opacity="0.7"/>
</svg>
